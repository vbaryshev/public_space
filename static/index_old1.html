<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <title>POI Visits — Interactive Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <div id="sidebar">
    <h2>Симуляция посещений POI</h2>

    <div class="block">
      <label class="label">Загрузка границ (.gpkg):</label>
      <input type="file" id="fileInput" accept=".gpkg"/>
      <button id="btnUpload">Загрузить</button>
      <div id="uploadStatus" class="status"></div>
    </div>

    <div class="block">
      <label class="label">Параметры симуляции</label>

      <div class="row">
        <label>Старт</label>
        <input type="datetime-local" id="start" value="2025-01-01T00:00"/>
      </div>
      <div class="row">
        <label>Финиш</label>
        <input type="datetime-local" id="end" value="2025-12-31T23:00"/>
      </div>
      <div class="row">
        <label>Частота</label>
        <input type="text" id="freq" value="H" />
      </div>
      <div class="row">
        <label>Base rate</label>
        <input type="number" id="baseRate" step="0.001" value="0.02"/>
      </div>

      <details>
        <summary>Множители контекстов (JSON)</summary>
        <div class="row">
          <label>time_of_day</label>
          <textarea id="todJson" rows="2">{ "morning": 0.9, "afternoon": 1.1, "evening": 1.0 }</textarea>
        </div>
        <div class="row">
          <label>weather</label>
          <textarea id="weatherJson" rows="2">{ "sunny": 1.2, "rainy": 0.3, "windy": 0.8, "snowy": 0.8 }</textarea>
        </div>
        <div class="row">
          <label>season</label>
          <textarea id="seasonJson" rows="2">{ "spring": 1.0, "summer": 1.5, "autumn": 0.7, "winter": 0.5 }</textarea>
        </div>
      </details>

      <details>
        <summary>Гравитационная модель</summary>
        <div class="row"><label>alpha</label><input type="number" id="alpha" step="0.1" value="1.0"/></div>
        <div class="row"><label>beta</label><input type="number" id="beta" step="0.1" value="1.2"/></div>
        <div class="row"><label>gamma</label><input type="number" id="gamma" step="0.1" value="1.0"/></div>
        <div class="row"><label>d0</label><input type="number" id="d0" step="1" value="50"/></div>
        <div class="row"><label>max_distance</label><input type="number" id="maxDistance" step="100" value="7000"/></div>
        <div class="row"><label>cutoff_distance</label><input type="number" id="cutoffDistance" step="100" value="7000"/></div>
      </details>

      <details>
        <summary>Веса типов POI (JSON, опционально)</summary>
        <textarea id="poiWeightsJson" rows="2">{ "mall": 1.5, "park": 0.8, "cafe": 1.1 }</textarea>
      </details>

      <button id="btnSimulate">Запустить симуляцию</button>
      <div id="simulateStatus" class="status"></div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
